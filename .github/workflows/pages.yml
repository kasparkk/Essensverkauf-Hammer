name: Faellig veroeffentlichen

on:
  push:
    branches: ["claude/german-invented-words-app-u3sajc"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages einrichten (schaltet Pages bei Bedarf selbst ein)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: App-Ordner als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: faellig

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Essensverkauf App-Icon">
  <title>Essensverkauf</title>

  <!-- Hintergrundkachel (randfüllend, damit iOS/Android beliebig zuschneiden können) -->
  <rect width="512" height="512" fill="#fdf3e3"/>

  <!-- Burger, zentriert in der Maskier-Schutzzone (mittlere ~68 %) -->
  <g transform="translate(45.9 62.3) scale(6.566)">
    <!-- Oberes Brötchen -->
    <path d="M6 28C6 15.85 17.64 6 32 6s26 9.85 26 22z" fill="#dfa25f"/>

    <!-- Sesamkörner -->
    <g fill="#fbeada">
      <ellipse cx="22" cy="17.5" rx="2.6" ry="1.7" transform="rotate(-22 22 17.5)"/>
      <ellipse cx="32" cy="13" rx="2.6" ry="1.7"/>
      <ellipse cx="42" cy="17.5" rx="2.6" ry="1.7" transform="rotate(22 42 17.5)"/>
      <ellipse cx="14.5" cy="23.5" rx="2.4" ry="1.6" transform="rotate(-38 14.5 23.5)"/>
      <ellipse cx="49.5" cy="23.5" rx="2.4" ry="1.6" transform="rotate(38 49.5 23.5)"/>
    </g>

    <!-- Salat -->
    <g fill="#7fa650">
      <path d="M6 28h52v5H6z"/>
      <circle cx="11" cy="33" r="3.4"/>
      <circle cx="21.5" cy="33" r="3.4"/>
      <circle cx="32" cy="33" r="3.4"/>
      <circle cx="42.5" cy="33" r="3.4"/>
      <circle cx="53" cy="33" r="3.4"/>
    </g>

    <!-- Frikadelle -->
    <rect x="5.5" y="34" width="53" height="9" rx="3.2" fill="#8f4a2b"/>

    <!-- Unteres Brötchen -->
    <path d="M6 43h52v4c0 3.3-2.7 6-6 6H12c-3.3 0-6-2.7-6-6z" fill="#d4954f"/>
  </g>
</svg>

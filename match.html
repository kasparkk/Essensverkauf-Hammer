<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Fußballmatch – Kick gegen den Computer</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#1e7a3d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Fußballmatch" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="match.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="ball-emoji" aria-hidden="true">⚽</span>
      <div class="brand-text">
        <h1>Match</h1>
        <p class="subtitle">Steuere dein Team und schieß den Computer ab</p>
      </div>
    </div>
    <nav class="game-nav">
      <a href="index.html">&larr; Strichliste</a>
      <a href="fussball.html">Elfmeterschießen</a>
    </nav>
  </header>

  <main class="game-main">
    <section class="scoreboard" aria-label="Spielstand">
      <div class="score-box">
        <span class="score-label">Du</span>
        <span id="player-score" class="score-value">0</span>
      </div>
      <div class="score-box time-box">
        <span class="score-label">Zeit</span>
        <span id="match-time" class="score-value">1:30</span>
      </div>
      <div class="score-box">
        <span class="score-label">Gegner</span>
        <span id="ai-score" class="score-value">0</span>
      </div>
    </section>

    <div class="canvas-wrap">
      <canvas id="pitch-canvas" width="760" height="460" aria-label="Fußballfeld"></canvas>
      <div id="event-banner" class="event-banner" hidden></div>
      <div id="end-overlay" class="end-overlay" hidden>
        <div class="end-card">
          <h2 id="end-title">Abpfiff</h2>
          <p id="end-text"></p>
          <button id="play-again-btn" type="button">Nochmal spielen</button>
        </div>
      </div>
    </div>

    <p class="hint">
      Steuerung: Pfeiltasten/WASD bewegen, Leertaste schießt, X passt.
      Am Handy: im Feld ziehen zum Laufen, Buttons unten zum Schießen/Passen.
    </p>

    <section class="controls" aria-label="Spielsteuerung">
      <button id="pass-btn" type="button" class="action-btn pass-btn">Pass</button>
      <button id="shoot-btn" type="button" class="action-btn shoot-btn">Schuss ⚽</button>
    </section>
  </main>

  <script src="match.js"></script>
</body>
</html>
